packages:
  - apps/*
  - packages/*
  - ee
allowBuilds:
  core-js: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.77'
  - ai@7.0.134
# Security patches the whole tree takes, peers and dependencies of dependencies too: one
# Next.js, Zod and undici everywhere. happy-dom is only vitest's optional peer (no test runs in it);
# 21.0.4 is the first version without the open advisories.
overrides:
  next: 16.4.1
  zod: 4.6.6
  undici: 7.30.1
  happy-dom: 21.0.4
