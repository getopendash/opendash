name: DCO

# Every commit in a pull request carries a Signed-off-by line for its author (CONTRIBUTING.md, "Sign your commits").
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # The commit's trailers, parsed by git, one exactly "Signed-off-by: <its author>".
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no 'Signed-off-by: $author' (git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
