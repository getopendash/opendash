name: Feature request
description: Something OpenDash should do.
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: What you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Optional.
